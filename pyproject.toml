[project]
name = "car-info"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "obd>=0.7.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
car-info = "car_info.main:main"

[build-system]
